<text x="72" y="796" dominant-baseline="central" font-size="12" fill="#A32D2D">inside the install.exe process</text>
<text x="76" y="815" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>copies Edge History, Web Data (autofill) and Network\Cookies</text>
<text x="76" y="831" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>launches chrome.exe (×10)</text>
<text x="76" y="847" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>lists installed software from the registry</text>
