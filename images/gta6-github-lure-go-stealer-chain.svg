<text x="72" y="143" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Redirector</text>
<text x="72" y="161" dominant-baseline="central" font-size="12" fill="#0F6E56">https://shanxisaide.com/s/file</text>
