<text x="350" y="533" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Browser data theft</text>
<text x="350" y="550" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">copies cookies, autofill and history; launches chrome.exe</text>
<rect x="70" y="588" width="560" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="350" y="608" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Persistence</text>
<text x="350" y="625" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">dropped exe runs from the Startup folder</text>
<text x="350" y="643" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#534AB7">MD5 7107adefdc607e8e3a6dfe7102d0e07f (RNyZi8Ng5asPa9DPaim9s.exe)</text>
<rect x="70" y="682" width="560" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="350" y="703" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">C2 exfiltration</text>
<text x="350" y="720" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">vibhe0.tattoo, buggergame.onl (behind Cloudflare)</text>
