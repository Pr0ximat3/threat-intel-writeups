<svg width="100%" viewBox="0 0 700 820" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Fake GTA 6 Full Build DLL side-loading infection chain</title><desc>A GitHub lure redirects through GitHub Pages to a ZIP; a renamed legitimate PotterDraw side-loads a malicious d3dx9_26.dll (a possible Go infostealer) that steals browser data, persists from Startup and exfiltrates to its C2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
