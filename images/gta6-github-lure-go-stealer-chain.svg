<text x="350" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">shanxisaide.com/s/file</text>
<rect x="70" y="172" width="560" height="54" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="350" y="193" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">GitHub Pages redirect</text>
<text x="350" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">yiwvywwuxkaz.github.io/warrior/ (Base64 target)</text>
<rect x="70" y="248" width="560" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Download</text>
<text x="350" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">sh-mylike.com/kl/Warrior-Pearl → app-V521GGC0.zip</text>
<rect x="70" y="324" width="560" height="72" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="350" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">install.exe = legitimate PotterDraw</text>
<text x="350" y="361" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">renamed loader; side-loads the DLL (clean, 0/68)</text>
<text x="350" y="379" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5F5E5A">SHA-256 496d1c75257ec33af07d2095084736d71837f5191615ca6b166ca12097e30863</text>
