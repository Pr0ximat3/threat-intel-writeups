<title>Fake GTA 6 Full Build DLL side-loading infection chain</title><desc>A GitHub lure redirects through shanxisaide.com and a GitHub Pages page to sh-mylike.com; the ZIP holds a renamed legitimate PotterDraw that side-loads a malicious d3dx9_26.dll, which copies browser data, launches Chrome, persists from Startup and uploads to two C2 domains.</desc>
