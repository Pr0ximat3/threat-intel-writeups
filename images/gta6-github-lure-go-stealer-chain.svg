<line x1="350" y1="568" x2="350" y2="586" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="350" y1="662" x2="350" y2="680" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="20" width="560" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="350" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Fake “GTA 6 Full Build” org</text>
<text x="350" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">github.com/GTA-6-CyberLeek-Full-Build (.github README)</text>
<rect x="70" y="96" width="560" height="54" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
