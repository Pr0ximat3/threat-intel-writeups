<svg width="100%" viewBox="0 0 700 514" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>EvilTokens device code phishing attack chain</title><desc>Two shorteners lead to a fake Teams page that requests a Microsoft device code via the EvilTokens backend; the victim enters it at the real Microsoft device-login page and the attacker receives M365 tokens.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="700" height="514" rx="16" fill="#FBFAF7"/>
<line x1="350" y1="76" x2="350" y2="94" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="152" x2="350" y2="170" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="228" x2="350" y2="246" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="304" x2="350" y2="322" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="380" x2="350" y2="398" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="20" width="560" height="54" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="350" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">cutt.ly short link</text>
<text x="350" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">cutt.ly/XyDdxvYU (301)</text>
<rect x="70" y="96" width="560" height="54" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="350" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">share.google redirect</text>
<text x="350" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Google’s own link shortener (302)</text>
<rect x="70" y="172" width="560" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="350" y="193" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Fake Microsoft Teams sign-in page</text>
<text x="350" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">teammeeting7826371100.b-cdn.net (Bunny CDN), blob: URL</text>
<rect x="70" y="248" width="560" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">EvilTokens backend requests a device code</text>
<text x="350" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">status.hci-marketingchain.net: /device/start, /device/status</text>
<rect x="70" y="324" width="560" height="54" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
<text x="350" y="345" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">Real microsoft.com/devicelogin</text>
<text x="350" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">victim enters code DDRSNYRJS and passes MFA</text>
<rect x="70" y="400" width="560" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="350" y="421" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Attacker receives the tokens</text>
<text x="350" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">access + refresh tokens for the victim’s M365 account</text>
<circle cx="70" cy="488" r="5" fill="#0F6E56"/>
<text x="80" y="488" dominant-baseline="central" font-size="12" fill="#444441">Redirect</text>
<circle cx="166" cy="488" r="5" fill="#185FA5"/>
<text x="176" y="488" dominant-baseline="central" font-size="12" fill="#444441">Lure</text>
<circle cx="234" cy="488" r="5" fill="#993C1D"/>
<text x="244" y="488" dominant-baseline="central" font-size="12" fill="#444441">Delivery</text>
<circle cx="330" cy="488" r="5" fill="#3B6D11"/>
<text x="340" y="488" dominant-baseline="central" font-size="12" fill="#444441">Microsoft (real)</text>
<circle cx="482" cy="488" r="5" fill="#A32D2D"/>
<text x="492" y="488" dominant-baseline="central" font-size="12" fill="#444441">Payload / C2</text>
</svg>
