<svg width="100%" viewBox="0 0 760 859" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>EvilTokens device code phishing attack chain</title><desc>cutt.ly and share.google redirect to a Bunny CDN page that re-renders from a blob: URL as a fake Teams sign-in; the EvilTokens backend requests a real device code, the victim enters it at Microsoft's genuine device login, and the attacker receives Microsoft 365 tokens.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="859" rx="16" fill="#FBFAF7"/>
<line x1="380" y1="99" x2="380" y2="119" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="200" x2="380" y2="220" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="317" x2="380" y2="337" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="450" x2="380" y2="470" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="583" x2="380" y2="603" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="700" x2="380" y2="720" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50" y="20" width="660" height="77" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="72" y="42" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">URL shortener</text>
<text x="72" y="60" dominant-baseline="central" font-size="12" fill="#0F6E56">https://cutt.ly/XyDdxvYU</text>
<text x="76" y="79" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#04342C"><tspan fill="#0F6E56">├─ </tspan>301 redirect</text>
<rect x="50" y="121" width="660" height="77" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="72" y="143" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Google’s own share-link shortener</text>
<text x="72" y="161" dominant-baseline="central" font-size="12" fill="#0F6E56">https://share.google/GAyWzmfkNq59VZtAM</text>
<text x="76" y="180" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#04342C"><tspan fill="#0F6E56">├─ </tspan>302 → www.google.com/share.google?q=…</text>
<rect x="50" y="222" width="660" height="93" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="72" y="244" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Landing page on Bunny CDN</text>
<text x="72" y="262" dominant-baseline="central" font-size="12" fill="#185FA5">https://teammeeting7826371100.b-cdn.net/index%20(12).html</text>
<text x="76" y="281" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>185.111.111.155 (shared Bunny CDN edge)</text>
<text x="76" y="297" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>page re-renders itself from a blob: URL</text>
<rect x="50" y="339" width="660" height="109" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="72" y="361" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Fake “Sign in – Microsoft Teams” page</text>
<text x="72" y="379" dominant-baseline="central" font-size="12" fill="#185FA5">blob:https://teammeeting7826371100.b-cdn.net/903277f2-…</text>
<text x="76" y="398" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>“Sign in to join your meeting” — Proxima Group, organiser Charles Chen</text>
<text x="76" y="414" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>button: Get verification code → fetch() to the backend</text>
<text x="76" y="430" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>later: “Sign-in approved” / “window closed” holding screens</text>
<rect x="50" y="472" width="660" height="109" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="494" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">EvilTokens backend (behind Cloudflare)</text>
<text x="72" y="512" dominant-baseline="central" font-size="12" fill="#993C1D">https://status.hci-marketingchain.net/static-export/api/</text>
<text x="76" y="531" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>GET  /visitor/country            geolocation / sandbox filter</text>
<text x="76" y="547" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>POST /device/start  (X-Antibot-Token)  → device code DDRSNYRJS</text>
<text x="76" y="563" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>GET  /device/status/744958       polled every few hundred ms</text>
<rect x="50" y="605" width="660" height="93" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
<text x="72" y="627" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">Real Microsoft device login (legitimate)</text>
<text x="72" y="645" dominant-baseline="central" font-size="12" fill="#3B6D11">microsoft.com/devicelogin → login.microsoftonline.com/common/oauth2/deviceauth</text>
<text x="76" y="664" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#173404"><tspan fill="#3B6D11">├─ </tspan>victim enters DDRSNYRJS, signs in and passes MFA</text>
<text x="76" y="680" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#173404"><tspan fill="#3B6D11">├─ </tspan>prompt: Microsoft Authentication Broker on another device in Denmark</text>
<rect x="50" y="722" width="660" height="77" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="72" y="744" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Attacker receives the tokens</text>
<text x="72" y="762" dominant-baseline="central" font-size="12" fill="#A32D2D">access + refresh tokens for the victim’s Microsoft 365 account</text>
<text x="76" y="781" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>mail, Teams, OneDrive, SharePoint; can register a device in the tenant</text>
<circle cx="55" cy="833" r="5" fill="#0F6E56"/>
<text x="65" y="833" dominant-baseline="central" font-size="12" fill="#444441">Redirect</text>
<circle cx="151" cy="833" r="5" fill="#185FA5"/>
<text x="161" y="833" dominant-baseline="central" font-size="12" fill="#444441">Lure</text>
<circle cx="219" cy="833" r="5" fill="#993C1D"/>
<text x="229" y="833" dominant-baseline="central" font-size="12" fill="#444441">Delivery</text>
<circle cx="315" cy="833" r="5" fill="#3B6D11"/>
<text x="325" y="833" dominant-baseline="central" font-size="12" fill="#444441">Microsoft (real)</text>
<circle cx="467" cy="833" r="5" fill="#A32D2D"/>
<text x="477" y="833" dominant-baseline="central" font-size="12" fill="#444441">Payload / C2</text>
