<line x1="350" y1="738" x2="350" y2="756" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="350" y1="814" x2="350" y2="832" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="20" width="560" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="350" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Fake Cloudflare verify page</text>
<text x="350" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">lambardianviews.com (ClickFix lure)</text>
<rect x="70" y="96" width="560" height="54" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="350" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Victim: Win+R, Ctrl+V, Enter</text>
<text x="350" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">pastes the clipboard PowerShell command</text>
<rect x="70" y="172" width="560" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="193" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">First-stage PowerShell (in memory)</text>
<text x="350" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">GET /s via Msxml2.XMLHTTP, then IEX</text>
<rect x="70" y="248" width="560" height="54" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.75"/>
<text x="350" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#72243E">Infection beacon</text>
<text x="350" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">GET /callback.php (204)</text>
<rect x="70" y="324" width="560" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Payload download</text>
<text x="350" y="361" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">GET /p1 — 1 MB MSI</text>
<text x="350" y="379" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#993C1D">SHA-256 89c28e7059e25d1e8cf5789d037f02e30da682ad7e7827482205353be39d2917</text>
<rect x="70" y="418" width="560" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="439" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Dropper + silent install</text>
<text x="350" y="456" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">edgeupd.ps1 → msiexec /i patch.msi /qn /norestart</text>
<rect x="70" y="494" width="560" height="72" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="350" y="514" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">AutoIt loader</text>
<text x="350" y="531" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Pave046.exe (legit AutoIt3) runs DepartManager.dat</text>
<text x="350" y="549" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5F5E5A">MD5 39593e5f17f12e398b39d768c374c277 (DepartManager.dat)</text>
<rect x="70" y="588" width="560" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="608" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Packed payload unpacked</text>
<text x="350" y="625" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">engine.data</text>
<text x="350" y="643" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#993C1D">MD5 470d24b15aad15579430abcf3569a9e7 (engine.data)</text>
<rect x="70" y="682" width="560" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="350" y="703" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">ArechClient2 (RAT + stealer)</text>
<text x="350" y="720" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">runs a hidden headless Chrome</text>
<rect x="70" y="758" width="560" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="350" y="779" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Persistence</text>
<text x="350" y="796" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Startup: DepartManager.vbs / .bat</text>
<rect x="70" y="834" width="560" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="350" y="855" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">C2 callback</text>
<text x="350" y="872" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">185.121.233.13:443 (VDSINA)</text>
